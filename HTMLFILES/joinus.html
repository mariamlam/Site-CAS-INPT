<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join CAS-INPT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSSFILES/joinus.css">
</head>
<body class="bg-light">
    <div class="header-image shadow-sm" 
         style="background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('../assests/background2.png'); 
                background-size: cover; 
                background-position: center; 
                height: 30vh;">
    </div>

    <div class="container text-center py-5">
        <h1 class="display-4 fw-bold text-dark">Join Our Family</h1>
        <p class="lead text-muted">Together, we build a brighter future.</p>
        
        </div>
</body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <a href="index.html" class="text-decoration-none mb-4 d-inline-block">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>

            <div class="card border-0 shadow-lg rounded-4 p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-heart text-primary display-4"></i>
                    <h2 class="fw-bold mt-2">Become a Member</h2>
                    <p class="text-muted">Fill in your details to join the CAS-INPT family.</p>
                </div>

                <form>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@inpt.ac.ma" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Academic Year / Department</label>
                        <select class="form-select">
                            <option selected disabled>Choose your department</option>
                            <option>INE 1</option>
                            <option>INE 2</option>
                            <option>INE 3</option>
                            <option>M1</option>
                            <option>M2</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Why do you want to join us?</label>
                        <textarea class="form-control" rows="4" placeholder="Tell us about your motivation..."></textarea>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Submit Application</button>
                    </div>
                </form>
            </div>
            
            <p class="text-center mt-4 text-muted small">
                © 2026 Club Affaires Sociales INPT
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JSFILES/joinus.js"></script>
</body>
</html>
